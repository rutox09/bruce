<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bruce</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <header>

      <div class="logo">
        B
      </div>

      <div class="header-info">
        <h1>Bruce</h1>
        <p>Asistente personal · Online</p>
      </div>

      <div class="header-actions">

        <button
          id="clearChat"
          class="clear-chat"
          type="button"
        >
          Borrar conversación
        </button>

        <div class="status">
          <span class="status-dot"></span>
          <span>Online</span>
        </div>

      </div>

    </header>


    <section id="chat">

      <div class="message bruce">
        Buenas. Soy Bruce. ¿En qué puedo ayudarte?
      </div>

    </section>


    <form id="inputArea">

      <button
        type="button"
        id="micButton"
        class="mic-button"
        title="Hablar con Bruce"
        aria-label="Hablar con Bruce"
      >
        🎙
      </button>

      <input
        id="messageInput"
        type="text"
        placeholder="Escribe un mensaje..."
        autocomplete="off"
        spellcheck="false"
      >

      <button
        type="submit"
        class="send-button"
      >
        Enviar
      </button>

    </form>

  </main>


  <script src="script.js"></script>

</body>
</html>
