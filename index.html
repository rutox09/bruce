<!DOCTYPE html>

<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bruce</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">


<header>
  <div class="logo">B</div>

  <div>
    <h1>Bruce</h1>
    <p>Asistente personal · Online</p>
  </div>
</header>

<section id="chat">

  <div class="message bruce">
    Buenas. Soy Bruce. ¿En qué puedo ayudarte?
  </div>

</section>

<form id="inputArea">

  <input
    id="messageInput"
    type="text"
    placeholder="Escribe un mensaje..."
    autocomplete="off"
  >

  <button type="submit">
    Enviar
  </button>

</form>


  </main>

  <script src="script.js"></script>

</body>
</html>
